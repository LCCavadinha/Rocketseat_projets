<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quicklist</title>
  <script src="https://kit.fontawesome.com/98d7cb019f.js" crossorigin="anonymous"></script>
</head>
<body>

  <header>
    <div class="logo"> 
      <img src="./src/assets/icons/logo.svg" alt="logo quicklist"> 
      <h1>quicklist</h1> 
    </div>
  </header>

  <main>
    <div class="shopping">
      <span>Voltar</span>
      <h2>Compras da semana</h2>
    </div>
    <form id="item-form">
      <input 
        id="item-input"
        type="text"
        placeholder="Adcione um novo item"
        autocomplete="off"
      >
      <button type="submit">Adicionar</button>
    </form>

    <section>
      <ul id="item-list">
        
      </ul>
      <p id="empty-state">Sua lista está vazia.</p>
    </section>

    <div id="feedback"></div>
  </main>
  <script src="./src/assets/js/script.js" ></script>
</body>
</html>
